[global]
   workgroup = EXAMPLE
   realm = EXAMPLE.COM
   security = ADS
   server role = member server

   # Explicit rather than auto-detected: getifaddrs()-based interface
   # detection can fail under systemd sandboxing (RestrictAddressFamilies
   # without AF_NETLINK) or other network-namespacing, and ntlm_auth then
   # fails every login with "Could not determine network interfaces".
   # Replace INTERFACE_NAME with this host's actual interface, e.g. from
   # `ip -br addr` - eth0, ens160, enp0s3, ...
   interfaces = lo INTERFACE_NAME
   bind interfaces only = yes

   kerberos method = secrets and keytab
   winbind refresh tickets = yes
   winbind use default domain = yes
   winbind enum users = no
   winbind enum groups = no

   idmap config * : backend = tdb
   idmap config * : range = 3000-7999
   idmap config EXAMPLE : backend = rid
   idmap config EXAMPLE : range = 10000-999999

   template shell = /usr/sbin/nologin
   client min protocol = SMB2
   client ipc signing = mandatory

   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

